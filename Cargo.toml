[package]
name = "zgui-plot"
version = "0.1.0"
edition = "2024"
authors = ["Kevin Plaizier <kevin.plaizier@tealdrones.com>"]
description = "Reusable 2D plotting, retained Zgui rendering, exports, and docking workspace controls"
license = "MIT OR BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/Quick-Flash/zgui-plot"
keywords = ["plotting", "visualization", "zgui", "charts", "docking"]
categories = ["graphics", "gui"]
include = ["Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-BSD-3-Clause", "src/**", "examples/**", "tests/**"]

[dependencies]
kurbo = "0.13.1"
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"], optional = true }
zgui = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b", optional = true }
zgui-ui = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b", optional = true }

[features]
default = []
zgui = ["dep:zgui"]
raster = ["dep:resvg"]
workspace = ["zgui", "dep:zgui-ui"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
zgui-platform-headless = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }
zgui-testkit-scene = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", rev = "9927866a6b2b48a8898352a150f9465108246b9b" }

[[example]]
name = "waves"
required-features = ["zgui"]

[[example]]
name = "time_series"
required-features = ["workspace"]

[[example]]
name = "data_plots"
required-features = ["workspace"]
